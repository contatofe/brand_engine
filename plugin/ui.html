<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family:
          Inter,
          -apple-system,
          sans-serif;
        font-size: 12px;
        color: #1a1a1a;
        margin: 0;
        padding: 16px;
      }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 4px;
      }
      input[type="text"] {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        margin-bottom: 12px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 12px;
      }
      input[type="file"] {
        margin-bottom: 8px;
      }
      img#preview {
        display: none;
        max-width: 100%;
        max-height: 140px;
        margin-bottom: 12px;
        border-radius: 4px;
        object-fit: cover;
      }
      .row {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
      button {
        padding: 8px 14px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-weight: 600;
        font-size: 12px;
      }
      button#apply {
        background: #18a0fb;
        color: #fff;
      }
      button#close {
        background: transparent;
        color: #555;
      }
      button#toggle-auto {
        background: #1a7f37;
        color: #fff;
      }
      button#toggle-auto.on {
        background: #cf222e;
      }
      hr {
        border: none;
        border-top: 1px solid #eee;
        margin: 16px 0;
      }
      #status,
      #auto-log {
        margin-top: 14px;
        font-size: 11px;
        white-space: pre-wrap;
      }
      .frame-ok {
        color: #1a7f37;
      }
      .frame-error {
        color: #cf222e;
      }
      .auto-line {
        color: #555;
      }
    </style>
  </head>
  <body>
    <label for="headline">Headline</label>
    <input id="headline" type="text" placeholder="Escreva seu título aqui" />

    <label for="image">Imagem (opcional)</label>
    <input id="image" type="file" accept="image/*" />
    <img id="preview" alt="preview" />

    <div class="row">
      <button id="apply">Aplicar</button>
      <button id="close">Fechar</button>
    </div>

    <div id="status"></div>

    <hr />

    <label>Automação</label>
    <div class="row">
      <button id="toggle-auto">Ligar</button>
    </div>
    <div id="auto-log"></div>

    <script>
      const SUPABASE_URL = process.env.SUPABASE_URL;
      const SUPABASE_ANON_KEY = process.env.SUPABASE_ANON_KEY;
      const POLL_INTERVAL_MS = 4000;

      let imageBytes = null;

      const imageInput = document.getElementById("image");
      const preview = document.getElementById("preview");

      imageInput.addEventListener("change", async () => {
        const file = imageInput.files && imageInput.files[0];
        if (!file) {
          imageBytes = null;
          preview.style.display = "none";
          return;
        }

        // figma.createImage ignora a orientação EXIF do arquivo original (fotos de
        // celular tiradas na vertical vêm marcadas para girar 90° na exibição).
        // createImageBitmap com imageOrientation:'from-image' força a decodificação
        // a já aplicar essa rotação nos pixels — diferente de <img>+canvas, que em
        // alguns motores desenha o pixel bruto ignorando a marcação.
        const bitmap = await createImageBitmap(file, {
          imageOrientation: "from-image",
        });

        const canvas = document.createElement("canvas");
        canvas.width = bitmap.width;
        canvas.height = bitmap.height;
        canvas.getContext("2d").drawImage(bitmap, 0, 0);

        const blob = await new Promise((resolve) =>
          canvas.toBlob(resolve, "image/png"),
        );
        const buffer = await blob.arrayBuffer();
        imageBytes = new Uint8Array(buffer);

        preview.src = URL.createObjectURL(blob);
        preview.style.display = "block";
      });

      document.getElementById("apply").onclick = () => {
        const headline = document.getElementById("headline").value;
        parent.postMessage(
          { pluginMessage: { type: "apply", headline, imageBytes } },
          "*",
        );
      };

      document.getElementById("close").onclick = () => {
        parent.postMessage({ pluginMessage: { type: "close" } }, "*");
      };

      window.onmessage = (event) => {
        const msg = event.data.pluginMessage;
        if (!msg) return;

        if (msg.type === "apply-result") {
          const status = document.getElementById("status");
          status.innerHTML = msg.perFrame
            .map((frame) => {
              const cls = frame.error ? "frame-error" : "frame-ok";
              const detail = frame.error ? " — " + frame.error : " — ok";
              return (
                '<div class="' +
                cls +
                '">' +
                frame.frameName +
                detail +
                "</div>"
              );
            })
            .join("");
        }

        if (msg.type === "apply-job-result") {
          handleJobResult(msg.jobId, msg.ok, msg.error, msg.renders);
        }
      };

      // --- Modo automático: consome a fila `jobs` do Supabase sem precisar
      // digitar nada dentro do Figma a cada job. Ver Fase 3 do plano. ---

      let polling = false;
      let inFlight = false;
      let pollTimer = null;

      function logAuto(text) {
        const log = document.getElementById("auto-log");
        const line = document.createElement("div");
        line.className = "auto-line";
        line.textContent = text;
        log.prepend(line);
        while (log.children.length > 8) log.removeChild(log.lastChild);
      }

      async function supabaseFetch(path, options) {
        const res = await fetch(`${SUPABASE_URL}${path}`, {
          ...options,
          headers: {
            apikey: SUPABASE_ANON_KEY,
            Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
            "Content-Type": "application/json",
            Prefer: "return=representation",
            ...(options && options.headers),
          },
        });
        if (!res.ok)
          throw new Error(`Supabase ${res.status}: ${await res.text()}`);
        return res.status === 204 ? null : res.json();
      }

      async function patchJob(id, fields) {
        await supabaseFetch(`/rest/v1/jobs?id=eq.${id}`, {
          method: "PATCH",
          body: JSON.stringify(fields),
        });
      }

      let currentJobId = null;

      function bytesToDataUrl(bytes) {
        return new Promise((resolve, reject) => {
          const blob = new Blob([bytes], { type: "image/png" });
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(blob);
        });
      }

      async function saveRenders(jobId, renders) {
        if (!renders || renders.length === 0) return;

        const payload = await Promise.all(
          renders.map(async (render) => ({
            name: render.name,
            image: await bytesToDataUrl(render.bytes),
          })),
        );

        const res = await fetch(`${SUPABASE_URL}/functions/v1/save-render`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
          },
          body: JSON.stringify({ jobId, renders: payload }),
        });

        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.error || `save-render ${res.status}`);
        }
      }

      async function handleJobResult(jobId, ok, error, renders) {
        if (ok) {
          try {
            await saveRenders(jobId, renders);
          } catch (e) {
            logAuto(`Falha ao subir renders do projeto ${jobId}: ${e.message}`);
          }
        }

        patchJob(jobId, {
          status: ok ? "done" : "error",
          error_message: error ?? null,
          applied_at: new Date().toISOString(),
        }).catch((e) =>
          logAuto(`Falha ao atualizar projeto ${jobId}: ${e.message}`),
        );

        logAuto(
          ok
            ? `Projeto ${jobId} aplicado ✅`
            : `Projeto ${jobId} com erro: ${error}`,
        );
        currentJobId = null;
        inFlight = false;
      }

      async function pollTick() {
        if (!polling) return;

        if (!inFlight) {
          inFlight = true;
          try {
            const jobs = await supabaseFetch(
              "/rest/v1/jobs?status=eq.pending&order=created_at.asc&limit=1",
            );

            if (jobs && jobs.length > 0) {
              const job = jobs[0];
              currentJobId = job.id;
              await patchJob(job.id, { status: "processing" });

              let bytes = null;
              if (job.image_url) {
                const imgRes = await fetch(job.image_url);
                bytes = new Uint8Array(await imgRes.arrayBuffer());
              }

              logAuto(`Aplicando projeto ${job.id}...`);
              parent.postMessage(
                {
                  pluginMessage: {
                    type: "apply-job",
                    jobId: job.id,
                    headline: job.headline,
                    imageBytes: bytes,
                  },
                },
                "*",
              );
              // handleJobResult (via apply-job-result) libera inFlight quando o code.ts responder.
              return;
            }
          } catch (error) {
            logAuto(`Erro no polling: ${error.message}`);
          }
          inFlight = false;
        }
      }

      function startPolling() {
        if (polling) return;
        polling = true;
        logAuto("Automático ligado.");
        pollTimer = setInterval(pollTick, POLL_INTERVAL_MS);
        pollTick();
      }

      function stopPolling() {
        polling = false;
        if (pollTimer) clearInterval(pollTimer);
        logAuto("Automático desligado.");
      }

      document.getElementById("toggle-auto").onclick = (event) => {
        if (polling) {
          stopPolling();
          event.target.textContent = "Ligar";
          event.target.classList.remove("on");
        } else {
          startPolling();
          event.target.textContent = "Desligar";
          event.target.classList.add("on");
        }
      };
    </script>
  </body>
</html>
